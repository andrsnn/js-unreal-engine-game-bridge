# Runs on every push and pull request, on GitHub's hosted runners (no Unreal, no GPU): installs the tools, checks
# the scripts and JSON, runs the unit tests, boots the example games in Node's fake DOM, builds the runtime with a
# game, and plays the browser half of the conformance suite in headless Chromium.
name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: |
          for dir in Runtime Examples/orbit-demo Examples/threejs-examples Tests/suite; do
            (cd "$dir" && npm ci --no-audit --no-fund)
          done
          (cd Tests/suite && npx playwright install --with-deps chromium)

      - name: Lint
        run: node Tools/lint.mjs

      - name: Unit tests
        run: node Tools/unit.mjs

      - name: Build the runtime with the orbit demo
        run: node Tools/jsgb.mjs build orbit-demo

      - name: Fake-DOM tests
        run: |
          node Tools/jsgb.mjs smoke orbit-demo --no-build --frames 300
          node Tools/jsgb.mjs smoke threejs-pointerlock --frames 300

      - name: Conformance suite, browser half
        run: node Tools/suite.mjs --web-only --games orbit-demo,threejs-fps,threejs-pointerlock

      - name: Upload the browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-web-report
          path: Builds/conformance-suite/web-report
          if-no-files-found: warn
