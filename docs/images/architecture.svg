<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7fb8c0"/>
    </marker>
    <linearGradient id="unreal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14212b"/>
      <stop offset="1" stop-color="#0d151c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="640" rx="18" fill="#0a1016"/>

  <!-- Game source -->
  <rect x="40" y="250" width="250" height="140" rx="12" fill="#1a2a33" stroke="#4fb3bf" stroke-width="2"/>
  <text x="165" y="295" text-anchor="middle" fill="#e8f4f6" font-size="20" font-weight="700">Your three.js game</text>
  <text x="165" y="322" text-anchor="middle" fill="#9fc3c9" font-size="15">HTML, CSS, JS modules,</text>
  <text x="165" y="342" text-anchor="middle" fill="#9fc3c9" font-size="15">shaders, assets</text>
  <text x="165" y="370" text-anchor="middle" fill="#ffd27a" font-size="14" font-weight="600">unchanged</text>

  <!-- Browser -->
  <rect x="380" y="60" width="300" height="110" rx="12" fill="#1a2430" stroke="#6c8fb3" stroke-width="2"/>
  <text x="530" y="102" text-anchor="middle" fill="#e8f0f8" font-size="20" font-weight="700">Browser</text>
  <text x="530" y="130" text-anchor="middle" fill="#a9bdd2" font-size="15">WebGL · DOM · Web Audio</text>
  <text x="530" y="152" text-anchor="middle" fill="#a9bdd2" font-size="13">Vite dev server, reload on save</text>
  <path d="M290,290 C340,250 340,130 378,118" fill="none" stroke="#7fb8c0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="300" y="185" fill="#7fb8c0" font-size="14">Vite</text>

  <!-- Bundle -->
  <rect x="380" y="270" width="210" height="100" rx="12" fill="#1a2a33" stroke="#4fb3bf" stroke-width="2"/>
  <text x="485" y="310" text-anchor="middle" fill="#e8f4f6" font-size="18" font-weight="700">One bundle</text>
  <text x="485" y="335" text-anchor="middle" fill="#9fc3c9" font-size="14">esbuild + bridge runtime</text>
  <text x="485" y="355" text-anchor="middle" fill="#9fc3c9" font-size="13">about 1 s to build</text>
  <path d="M290,320 L378,320" fill="none" stroke="#7fb8c0" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Unreal -->
  <rect x="640" y="210" width="530" height="400" rx="16" fill="url(#unreal)" stroke="#9a7bd1" stroke-width="2"/>
  <text x="905" y="245" text-anchor="middle" fill="#efe8fb" font-size="20" font-weight="700">Unreal Engine 5.8</text>

  <rect x="665" y="270" width="230" height="120" rx="10" fill="#22303b" stroke="#4fb3bf" stroke-width="1.5"/>
  <text x="780" y="302" text-anchor="middle" fill="#e8f4f6" font-size="17" font-weight="700">Puerts V8</text>
  <text x="780" y="326" text-anchor="middle" fill="#9fc3c9" font-size="14">the game's own code</text>
  <text x="780" y="348" text-anchor="middle" fill="#9fc3c9" font-size="14">linkedom DOM, timers,</text>
  <text x="780" y="368" text-anchor="middle" fill="#9fc3c9" font-size="14">fetch, storage, input, workers</text>
  <path d="M590,320 L663,320" fill="none" stroke="#7fb8c0" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="925" y="270" width="225" height="120" rx="10" fill="#22303b" stroke="#9a7bd1" stroke-width="1.5"/>
  <text x="1037" y="302" text-anchor="middle" fill="#efe8fb" font-size="17" font-weight="700">Scene mirror</text>
  <text x="1037" y="326" text-anchor="middle" fill="#c4b6de" font-size="14">meshes, instances, lights,</text>
  <text x="1037" y="348" text-anchor="middle" fill="#c4b6de" font-size="14">lines, points, sprites,</text>
  <text x="1037" y="368" text-anchor="middle" fill="#c4b6de" font-size="14">GLSL to HLSL materials</text>
  <path d="M895,330 L923,330" fill="none" stroke="#7fb8c0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="910" y="262" text-anchor="middle" fill="#7fb8c0" font-size="12">scene frames</text>

  <rect x="665" y="450" width="230" height="130" rx="10" fill="#22303b" stroke="#6c8fb3" stroke-width="1.5"/>
  <text x="780" y="482" text-anchor="middle" fill="#e8f0f8" font-size="17" font-weight="700">UI overlay (CEF)</text>
  <text x="780" y="506" text-anchor="middle" fill="#a9bdd2" font-size="14">the page's HTML and CSS,</text>
  <text x="780" y="528" text-anchor="middle" fill="#a9bdd2" font-size="14">drawn over the game view;</text>
  <text x="780" y="550" text-anchor="middle" fill="#a9bdd2" font-size="14">clicks go back to the game</text>
  <path d="M760,390 L760,448" fill="none" stroke="#7fb8c0" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M800,448 L800,392" fill="none" stroke="#7fb8c0" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="925" y="450" width="225" height="130" rx="10" fill="#22303b" stroke="#c9a85c" stroke-width="1.5"/>
  <text x="1037" y="482" text-anchor="middle" fill="#f6eedc" font-size="17" font-weight="700">Audio</text>
  <text x="1037" y="506" text-anchor="middle" fill="#d9c8a0" font-size="14">Web Audio graphs become</text>
  <text x="1037" y="528" text-anchor="middle" fill="#d9c8a0" font-size="14">Unreal voices: files and</text>
  <text x="1037" y="550" text-anchor="middle" fill="#d9c8a0" font-size="14">synthesized sound</text>
  <path d="M880,390 L960,448" fill="none" stroke="#7fb8c0" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Hot reload -->
  <rect x="40" y="470" width="540" height="110" rx="12" fill="#1f1a10" stroke="#c9a85c" stroke-width="1.5"/>
  <text x="310" y="505" text-anchor="middle" fill="#ffd27a" font-size="18" font-weight="700">Save a file</text>
  <text x="310" y="532" text-anchor="middle" fill="#e6d6b0" font-size="15">the browser reloads, and Unreal rebuilds the bundle</text>
  <text x="310" y="556" text-anchor="middle" fill="#e6d6b0" font-size="15">and restarts V8 with it, showing the reload time</text>
</svg>
